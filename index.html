<style>
  :root{
    --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);--dur:.22s;
    --r-panel:12px;--r:6px;
  }
  :root,:root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f5f5;--grid:rgba(0,0,0,.09);--tint:rgba(13,153,255,.05);
    --glass:rgba(255,255,255,.74);--glass-border:rgba(0,0,0,.08);--hl:rgba(255,255,255,.7);
    --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
    --text:#1e1e1e;--muted:#757575;--sep:rgba(0,0,0,.07);--border:rgba(0,0,0,.1);
    --fill:rgba(0,0,0,.045);--fill-hover:rgba(0,0,0,.08);--fill-soft:rgba(255,255,255,.55);
    --seg-on:#fff;--seg-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.08);
    --accent:#0d99ff;--ok:#14ae5c;--danger:#f24822;
    --tag-bg:rgba(255,255,255,.95);--tag-line:rgba(0,0,0,.1);--tag-fg:#1e1e1e;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1e1e1e;--grid:rgba(255,255,255,.07);--tint:rgba(13,153,255,.05);
    --glass:rgba(44,44,44,.74);--glass-border:rgba(255,255,255,.08);--hl:rgba(255,255,255,.05);
    --shadow:0 1px 3px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.35);
    --text:#f0f0f0;--muted:#9a9a9a;--sep:rgba(255,255,255,.07);--border:rgba(255,255,255,.12);
    --fill:rgba(255,255,255,.06);--fill-hover:rgba(255,255,255,.1);--fill-soft:rgba(255,255,255,.025);
    --seg-on:rgba(255,255,255,.13);--seg-shadow:0 1px 2px rgba(0,0,0,.3);
    --accent:#0d99ff;--ok:#1bc47d;--danger:#ff6b4a;
    --tag-bg:rgba(36,36,36,.94);--tag-line:rgba(255,255,255,.12);--tag-fg:#f0f0f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);font-size:12px;background:var(--bg);color:var(--text);
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  /* smooth colour cross-fade while switching theme */
  html.theme-anim *,html.theme-anim *::before{transition:background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease),box-shadow .35s var(--ease)!important}

  /* ---------- glass ---------- */
  .glass{background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--hl),var(--shadow)}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(circle,var(--grid) 1px,transparent 1.2px) 0 0/20px 20px,
      radial-gradient(60vw 60vw at 20% 10%,var(--tint),transparent 70%),
      var(--bg)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

  /* ---------- header ---------- */
  header{position:fixed;top:12px;left:12px;right:304px;z-index:5;height:44px;border-radius:var(--r-panel);
    display:flex;align-items:center;gap:10px;padding:0 8px 0 10px}
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap}
  .logo{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--accent)}
  .logo .ic{width:14px;height:14px;stroke-width:1.8}
  .vsep{width:1px;height:20px;background:var(--sep)}
  .scale-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r);
    color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;
    transition:color var(--dur) var(--ease)}
  .scale-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;
    transition:background-color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
  .scale-pill.on{color:var(--text)}
  .scale-pill.on::before{background:var(--ok);opacity:1}
  .toggles{margin-left:auto;display:flex;align-items:center;gap:6px}

  /* ---------- segmented control (sliding thumb) ---------- */
  .seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;
    background:var(--fill);border-radius:var(--r)}
  .seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px;
    width:calc((100% - 4px - (var(--n,2) - 1) * 2px) / var(--n,2));
    background:var(--seg-on);box-shadow:var(--seg-shadow);
    transform:translateX(calc(var(--i,0) * (100% + 2px)));
    transition:transform .34s var(--ease),opacity var(--dur) var(--ease)}
  .seg.none::before{opacity:0}
  .seg button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:24px;min-width:32px;padding:0 8px;border:0;border-radius:4px;background:transparent;
    color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:color var(--dur) var(--ease)}
  .seg button:hover,.seg button.on{color:var(--text)}
  .seg.lg button{height:28px;font-size:12px}
  .seg.lg button .ic{transition:color var(--dur) var(--ease)}
  .seg.lg button.on .ic{color:var(--accent)}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;
    border:1px solid transparent;border-radius:var(--r);background:var(--fill);color:var(--text);font-size:12px;font-weight:500;
    cursor:pointer;white-space:nowrap;
    transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease),transform .16s var(--ease)}
  .btn:hover{background:var(--fill-hover)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
  .btn.danger.solid{background:var(--danger);color:#fff}
  .btn.danger.solid:hover{background:color-mix(in srgb,var(--danger) 88%,#000)}
  .btn.block{width:100%}
  .btn.on{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--border)}
  .btn.ghost:hover{color:var(--text);background:var(--fill)}
  .tool-btn,.icon-btn{display:inline-grid;place-items:center;flex-shrink:0;border:0;background:transparent;cursor:pointer;
    transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),opacity var(--dur) var(--ease)}
  .tool-btn{width:28px;height:28px;border-radius:var(--r);color:var(--muted)}
  .tool-btn:hover{background:var(--fill);color:var(--text)}
  .icon-btn{width:22px;height:22px;border-radius:4px;color:var(--muted);opacity:.55}
  .icon-btn .ic{width:12px;height:12px;stroke-width:1.8}
  .ghead:hover .icon-btn,.item:hover .icon-btn,.icon-btn:focus-visible{opacity:1}
  .icon-btn:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
  /* theme icon: sun in dark mode, moon in light mode */
  #themeBtn .moon,:root[data-theme="dark"] #themeBtn .sun{display:block}
  #themeBtn .sun,:root[data-theme="dark"] #themeBtn .moon{display:none}
  #themeBtn .ic{transition:transform .4s var(--ease)}
  #themeBtn:active .ic{transform:rotate(-30deg) scale(.9)}

  /* ---------- sidebar ---------- */
  aside{position:fixed;top:12px;right:12px;bottom:12px;width:280px;z-index:5;border-radius:var(--r-panel);
    display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--fill-hover) transparent}
  .blk{padding:14px 14px 12px}
  .blk+.blk{border-top:1px solid var(--sep)}
  .blk h2{font-size:11px;font-weight:600;color:var(--text);margin-bottom:8px}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
  .row{display:flex;gap:6px;margin-top:8px;align-items:center;transition:opacity .3s var(--ease)}
  .calrow-off{opacity:.4;pointer-events:none}
  .field{flex:1;min-width:0;display:flex;align-items:center;height:32px;border-radius:var(--r);background:var(--fill);
    border:1px solid transparent;padding:0 10px;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
  .field:hover{border-color:var(--border)}
  .field:focus-within{border-color:var(--accent);background:var(--fill-soft)}
  .field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:12px;font-variant-numeric:tabular-nums}
  .field .u{font-size:11px;color:var(--muted)}

  /* groups */
  .group{border-radius:8px;margin-bottom:6px;border:1px solid var(--sep);background:var(--fill-soft);
    transition:border-color .3s var(--ease),background-color .3s var(--ease)}
  .group.active{border-color:color-mix(in srgb,var(--gc) 65%,transparent)}
  .ghead{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 9px}
  .gdot{width:10px;height:10px;border-radius:3px;border:0;cursor:pointer;flex-shrink:0;padding:0;background:var(--gc);
    transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .gdot:hover{transform:scale(1.15)}
  .group.active .gdot{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--gc)}
  .gname,.iname{flex:1;min-width:0;height:24px;border:1px solid transparent;border-radius:4px;background:transparent;padding:0 5px;margin-left:-5px;
    transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
  .gname{font-size:12px;font-weight:600}
  .iname{font-size:12px;color:var(--muted)}
  .gname:hover,.iname:hover{border-color:var(--border)}
  .gname:focus,.iname:focus{outline:none;border-color:var(--accent);background:var(--fill-soft);color:var(--text)}
  .gsum{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .item{display:flex;align-items:center;gap:6px;padding:2px 5px 2px 25px;border-top:1px solid var(--sep)}
  .item .v{font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
  .enter{animation:enter .38s var(--ease) both}
  .empty{color:var(--muted);font-size:11px;padding:2px 0 10px}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:8px 10px;border-radius:var(--r);
    background:var(--fill);font-size:11px;color:var(--muted)}
  .total b{color:var(--text);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .acts #export{grid-column:1/-1}
  .keys{font-size:11px;color:var(--muted);line-height:1.95}
  .keys kbd{display:inline-block;min-width:18px;padding:0 5px;line-height:17px;border-radius:4px;font:500 10.5px var(--font);
    background:var(--fill);color:var(--text);border:1px solid var(--sep);text-align:center}

  /* ---------- canvas overlays ---------- */
  .zoom{position:fixed;left:12px;bottom:12px;z-index:4;display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px}
  .zoom button{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r);background:transparent;
    color:var(--text);cursor:pointer;transition:background-color var(--dur) var(--ease),transform .16s var(--ease)}
  .zoom button:hover{background:var(--fill)}
  .zoom button:active{background:var(--fill-hover);transform:scale(.94)}
  .zoom .sep{width:1px;height:18px;margin:0 2px;background:var(--sep)}
  .zoom button:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
  #pager{display:flex;align-items:center;gap:2px;animation:enter .38s var(--ease) both}
  #pager[hidden]{display:none}
  #pgLbl{min-width:44px;text-align:center;font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  #drop{position:fixed;top:68px;left:12px;right:304px;bottom:12px;z-index:3;display:flex;align-items:center;justify-content:center;
    padding:24px;pointer-events:none}
  #drop.hide{display:none}
  #drop:not(.hide) .drop-card{animation:rise .5s var(--ease) both}
  .drop-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
    padding:28px 32px 24px;border-radius:var(--r-panel);max-width:340px}
  .drop-ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted);
    background:var(--fill);border:1px dashed var(--border)}
  .drop-ic .ic{width:20px;height:20px}
  #dropMain{font-size:14px;font-weight:600}
  #dropSub{font-size:11px;line-height:1.5;color:var(--muted);margin-top:-6px;max-width:260px}
  #pick{pointer-events:auto;margin-top:4px}

  /* ---------- dialog + toast ---------- */
  dialog{margin:auto;border-radius:var(--r-panel);padding:16px;width:min(320px,calc(100vw - 32px));color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.18)}
  dialog[open]{animation:pop .26s var(--ease)}
  dialog[open]::backdrop{animation:fade .26s var(--ease)}
  dialog.closing{animation:popOut .18s var(--ease) forwards}
  dialog.closing::backdrop{animation:fadeOut .18s var(--ease) forwards}
  #dlgMsg{font-size:12px;line-height:1.5;margin-bottom:16px}
  .dlg-acts{display:flex;gap:6px;justify-content:flex-end}
  #toast{position:fixed;top:68px;left:50%;z-index:20;transform:translate(-50%,-6px) scale(.98);opacity:0;pointer-events:none;
    padding:8px 12px;border-radius:8px;font-size:12px;max-width:calc(100vw - 32px);
    transition:opacity .3s var(--ease),transform .3s var(--ease)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  header,aside,.zoom{animation:rise .5s var(--ease) both}
  aside{animation-delay:.04s}
  .zoom{animation-delay:.08s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  @keyframes enter{from{opacity:0;transform:translateY(-3px)}}
  @keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
  @keyframes popOut{to{opacity:0;transform:scale(.98)}}
  @keyframes fade{from{opacity:0}}
  @keyframes fadeOut{to{opacity:0}}

  @media (max-width:760px){
    header{top:8px;left:8px;right:8px;gap:8px}
    aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:44vh}
    .zoom{left:8px;bottom:auto;top:60px}
    #drop{top:60px;left:8px;right:8px;bottom:calc(44vh + 16px)}
    #toast{top:60px}
  }
  @media (max-width:440px){
    .brand span,.vsep{display:none}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::backdrop{transition:none!important;animation:none!important}}
</style>
</head>

<div id="stage">
  <canvas id="cv"></canvas>
</div>

<header class="glass">
  <div class="brand"><div class="logo"><svg class="ic"><use href="#i-logo"/></svg></div><span>PixelScale</span></div>

<script>
"use strict";
const KEY='pixelscale.v1', LKEY='pixelscale.lang';

const I18N={
  en:{
    scaleNone:'No scale', s1:'1 · Scale', setCal:'Calibrate', unit:'m',

    s2:'2 · Measure', distTab:'Distance', areaTab:'Area',

    alNeed2:'First click two points on the known distance.',
    alLen:'Enter a valid length in metres.', alNoMeas:'No measurements to export.',

  },
  de:{
    scaleNone:'Kein Maßstab', s1:'1 · Maßstab', setCal:'Kalibrieren', unit:'m',
    calHint:'Zwei Punkte auf eine bekannte Strecke klicken (z.B. die 0–4 m Skala), Länge eintragen.',
    calMode:'Kalibriermodus aktiv.',
    s2:'2 · Messen', distTab:'Strecke', areaTab:'Fläche',
    distHint:'Punkte entlang einer Strecke klicken, Doppelklick beendet.', areaHint:'Eckpunkte klicken, Doppelklick schließt.',
    calStart:'Die zwei Enden einer bekannten Strecke im Bild anklicken.',
    calEnter:'Wie lang ist diese Linie in echt? Länge eintragen, dann OK.',
    meas:'Messungen', none:'Noch keine Messungen', sumAreas:'Summe Flächen',
    addGroup:'Gruppe hinzufügen', setActive:'Als aktive Gruppe setzen', scaleLbl:'Maßstab',
    cfGroup:'Diese Gruppe samt Messungen löschen?', grp:'Gruppe',
    exportBtn:'PDF exportieren', resetBtn:'Zurücksetzen', newBtn:'Neu',
    ctl:'Steuerung', dropMain:'Grundriss online ausmessen', dropSub:'Grundriss, Bauplan, Bild oder PDF hierher ziehen, um Strecken und Flächen zu messen. Bleibt auf deinem Gerät — nichts wird hochgeladen.', choose:'Importieren',
    distance:'Strecke', area:'Fläche', calibration:'Kalibrierung', scaleMissing:'— (Maßstab fehlt)',
    alNeed2:'Erst zwei Punkte auf der bekannten Strecke klicken.',
    alLen:'Gültige Länge in Metern eintragen.', alNoMeas:'Keine Messungen zum Exportieren.',
    cfReset:'Bild, Maßstab und alle Messungen löschen?',
    cancel:'Abbrechen', del:'Löschen', resetConfirm:'Zurücksetzen', theme:'Dunkel / Hell umschalten',
    fileFail:'Diese Datei lässt sich nicht öffnen. Ein Bild oder eine PDF versuchen.', page:'Seite',
    keys:'<kbd>Klick</kbd> Punkt setzen · rastet an Punkten ein<br><kbd>Doppelklick</kbd> oder <kbd>Rechtsklick</kbd> beenden &amp; speichern<br><kbd>Esc</kbd> aktuelle verwerfen<br><kbd>Shift</kbd> + ziehen / mittlere Maustaste — verschieben<br><kbd>Mausrad</kbd> zoomen'
  }
};
let lang = localStorage.getItem(LKEY) || 'en';
let unit = localStorage.getItem('pixelscale.unit') || 'm';
const M2FT=3.280839895, M2IN=39.37007874, M2FT2=10.76391042, FT2M=0.3048;
const T = ()=>I18N[lang];
const ICON = id=>`<svg class="ic"><use href="#i-${id}"/></svg>`;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),drop=document.getElementById('drop');
const hdr=document.querySelector('header'),side=document.querySelector('aside');
let img=null,imgSrc=null,view={s:1,x:0,y:0},pxPerM=null,mode='distance';
let pending=[],calPending=null,mouse=null,snap=null;
let W=0,H=0;
const SNAP_PX=11;
let groups=[], activeGroupId=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const PALETTE=['#ff375f','#30d158','#0a84ff','#bf5af2','#ff9f0a','#40c8e0','#ff453a','#5e5ce6'];
function pickColor(){const used=new Set(groups.map(g=>g.color));for(const c of PALETTE)if(!used.has(c))return c;return PALETTE[groups.length%PALETTE.length];}
const allItems=()=>groups.flatMap(g=>g.items);
function groupDefaultName(){return (lang==='de'?'Gruppe ':'Group ')+(groups.length+1);}
function ensureActiveGroup(){
  if(!groups.length){const g={id:uid(),name:groupDefaultName(),color:pickColor(),items:[]};groups.push(g);activeGroupId=g.id;}
  if(!groups.find(g=>g.id===activeGroupId))activeGroupId=groups[0].id;
  return groups.find(g=>g.id===activeGroupId);
}
function computeValue(type,pts){
  if(!pxPerM)return null;
  if(type==='distance'){let len=0;for(let i=0;i<pts.length-1;i++)len+=dist(pts[i],pts[i+1]);return len/pxPerM;}
  let a=0;for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}
  return Math.abs(a)/2/(pxPerM*pxPerM);
}
function snapTargets(){const pts=[];allItems().forEach(it=>it.points.forEach(p=>pts.push(p)));
  for(let i=0;i<pending.length-1;i++)pts.push(pending[i]);return pts;}
function findSnap(sx,sy){let best=null,bd=SNAP_PX;for(const p of snapTargets()){const s=toScr(p);const d=Math.hypot(s.x-sx,s.y-sy);if(d<bd){bd=d;best=p;}}return best;}

/* ---------- theme (system default, manual override persisted) ---------- */
const THKEY='pixelscale.theme',root=document.documentElement;
let TH={},themeAnimTimer=null;
function readTheme(){const cs=getComputedStyle(root),v=n=>cs.getPropertyValue(n).trim();
  TH={accent:v('--accent'),tagBg:v('--tag-bg'),tagLine:v('--tag-line'),tagFg:v('--tag-fg'),font:v('--font')};}
function setTheme(t){root.classList.add('theme-anim');root.dataset.theme=t;readTheme();draw();
  clearTimeout(themeAnimTimer);themeAnimTimer=setTimeout(()=>root.classList.remove('theme-anim'),400);}
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
darkMQ.addEventListener('change',()=>{if(!localStorage.getItem(THKEY))setTheme(darkMQ.matches?'dark':'light');});
themeBtn.addEventListener('click',()=>{const t=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem(THKEY,t);setTheme(t);});

/* ---------- segmented controls: slide the thumb to the active button ---------- */
function syncSeg(el){const bs=[...el.querySelectorAll('button')],i=bs.findIndex(b=>b.classList.contains('on'));
  el.style.setProperty('--n',bs.length);el.style.setProperty('--i',Math.max(0,i));el.classList.toggle('none',i<0);}
const syncSegs=()=>document.querySelectorAll('.seg').forEach(syncSeg);

/* ---------- dialogs ---------- */
const dlg=document.getElementById('dlg'),toast=document.getElementById('toast');
function ask(msg,okLabel){return new Promise(res=>{
  dlgMsg.textContent=msg;dlgOk.textContent=okLabel;dlgCancel.textContent=T().cancel;
  const done=v=>{dlg.classList.add('closing');setTimeout(()=>{dlg.classList.remove('closing');dlg.close();},180);res(v);};
  dlgOk.onclick=()=>done(true);dlgCancel.onclick=()=>done(false);
  dlg.oncancel=e=>{e.preventDefault();done(false);};
  dlg.showModal();dlgCancel.focus();});}
let toastTimer=null;
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),2800);}

/* ---------- i18n apply ---------- */
function applyLang(){
  const t=T();
  document.documentElement.lang=lang;
  document.getElementById('t-s1').textContent=t.s1;
  document.getElementById('t-setCal').textContent=t.setCal;
  document.getElementById('t-unit').textContent=t.unit;
  document.getElementById('calHint').textContent=t.calHint;
  document.getElementById('t-s2').textContent=t.s2;
  document.getElementById('t-dist').textContent=t.distTab;
  document.getElementById('t-area').textContent=t.areaTab;
  document.getElementById('t-meas').textContent=t.meas;
  document.getElementById('t-export').textContent=t.exportBtn;
  document.getElementById('t-reset').textContent=t.resetBtn;
  document.getElementById('t-new').textContent=t.newBtn;
  document.getElementById('t-ctl').textContent=t.ctl;
  document.getElementById('t-addGroup').textContent=t.addGroup;
  document.getElementById('keys').innerHTML=t.keys;
  document.getElementById('dropMain').textContent=t.dropMain;
  document.getElementById('dropSub').textContent=t.dropSub;
  document.getElementById('t-pick').textContent=t.choose;
  document.getElementById('modeHint').textContent = mode==='calibrate'?t.calMode:(mode==='area'?t.areaHint:t.distHint);
  document.querySelectorAll('.seg button[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  themeBtn.title=t.theme;
  applyUnit();
  updateScalePill(); renderList(); draw();
}
document.querySelectorAll('.seg button[data-lang]').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.lang; localStorage.setItem(LKEY,lang); applyLang();
}));
document.querySelectorAll('.seg button[data-unit]').forEach(b=>b.addEventListener('click',()=>{
  unit=b.dataset.unit; localStorage.setItem('pixelscale.unit',unit); applyUnit(); updateScalePill(); renderList(); draw();
}));
function applyUnit(){
  document.getElementById('t-unit').textContent = unit;
  document.querySelectorAll('.seg button[data-unit]').forEach(b=>b.classList.toggle('on',b.dataset.unit===unit));
  syncSegs();
}

/* ---------- persistence (silent) ---------- */
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
  const data={imgSrc,pxPerM,groups,activeGroupId};
  try{ localStorage.setItem(KEY,JSON.stringify(data)); }
  catch(e){ try{ localStorage.setItem(KEY,JSON.stringify({...data,imgSrc:null})); }catch(_){} }
},350); }
function restore(){ try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(!s)return;
  pxPerM=s.pxPerM||null;
  if(Array.isArray(s.groups)){ groups=s.groups; activeGroupId=s.activeGroupId||(groups[0]&&groups[0].id)||null; }
  else if(Array.isArray(s.measurements)&&s.measurements.length){
    const g={id:uid(),name:(lang==='de'?'Gruppe 1':'Group 1'),color:PALETTE[0],items:s.measurements.map((m,i)=>({id:uid(),type:m.type,points:m.points,value:m.value,name:(m.type==='area'?T().area:T().distance)+' '+(i+1)}))};
    groups=[g]; activeGroupId=g.id;
  }
  groups.forEach((g,i)=>{if(!g.color)g.color=PALETTE[i%PALETTE.length];});
  if(s.imgSrc){ imgSrc=s.imgSrc; const im=new Image(); im.onload=()=>{img=im;drop.classList.add('hide');fit();}; im.src=s.imgSrc; }
}catch(e){} }

/* ---------- load image / PDF ---------- */
const MAX_EDGE=2400;
// flatten onto white so transparent PNG/SVG/PDF pages don't turn black as JPEG
function whiteCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);return c;}
function setImage(src){imgSrc=src;
  const im2=new Image(); im2.onload=()=>{img=im2;drop.classList.add('hide');pending=[];calPending=null;fit();save();}; im2.src=imgSrc;}
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
function loadFile(f){
  if(isPdf(f))return loadPdf(f);
  const r=new FileReader();
  r.onload=e=>{ const im=new Image(); im.onload=()=>{
    pdfDoc=null;syncPager();
    const w=im.naturalWidth||1600,h=im.naturalHeight||1200,sc=Math.min(1,MAX_EDGE/Math.max(w,h));
    const c=whiteCanvas(Math.round(w*sc),Math.round(h*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); setImage(c.toDataURL('image/jpeg',0.85));
  }; im.onerror=()=>notify(T().fileFail); im.src=e.target.result; };
  r.readAsDataURL(f);
}

/* PDF support: pdf.js is bundled in vendor/ and only loaded when a PDF is opened */
let pdfDoc=null,pdfPage=1,pdfBusy=false;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s);});}
async function getPdfjs(){
  if(!window.pdfjsLib){await loadScript('vendor/pdfjs/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdfjs/pdf.worker.min.js';}
  return window.pdfjsLib;}
async function loadPdf(f){
  try{const lib=await getPdfjs();
    const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
    pdfDoc=doc;await showPdfPage(1);}
  catch(e){pdfDoc=null;syncPager();notify(T().fileFail);}}
async function showPdfPage(n){if(!pdfDoc||pdfBusy)return;pdfBusy=true;
  try{const page=await pdfDoc.getPage(n),v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:MAX_EDGE/Math.max(v1.width,v1.height)});
    const c=whiteCanvas(Math.round(vp.width),Math.round(vp.height));
    // 'print' intent renders without requestAnimationFrame, so it also finishes in background tabs
    await page.render({canvasContext:c.getContext('2d'),viewport:vp,intent:'print'}).promise;
    pdfPage=n;syncPager();setImage(c.toDataURL('image/jpeg',0.85));}
  finally{pdfBusy=false;}}
function syncPager(){const n=pdfDoc?pdfDoc.numPages:0;pager.hidden=n<2;if(n<2)return;
  pgLbl.textContent=pdfPage+' / '+n;pgLbl.title=T().page+' '+pdfPage;pgPrev.disabled=pdfPage<=1;pgNext.disabled=pdfPage>=n;}
pgPrev.onclick=()=>showPdfPage(pdfPage-1);
pgNext.onclick=()=>showPdfPage(pdfPage+1);
file.addEventListener('change',e=>{e.target.files[0]&&loadFile(e.target.files[0]);e.target.value='';});
pick.addEventListener('click',()=>file.click());
newimg.addEventListener('click',()=>file.click());
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&loadFile(e.dataTransfer.files[0]);});

/* ---------- view ---------- */
function resize(){const dpr=devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
addEventListener('resize',resize);
// visible canvas area not covered by the floating header / sidebar
function viewBox(){const h=hdr.getBoundingClientRect(),a=side.getBoundingClientRect();
  const b={l:0,t:h.bottom,r:W,b:H};
  if(a.left>W/2)b.r=a.left;else b.b=Math.min(H,a.top);
  return b;}
let viewAnim=0;
// ease the view towards a target (used by the zoom buttons, not the wheel)
function animateView(to){cancelAnimationFrame(viewAnim);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){Object.assign(view,to);draw();return;}
  const from={...view},t0=performance.now(),D=320;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,4);
    view.s=from.s+(to.s-from.s)*e;view.x=from.x+(to.x-from.x)*e;view.y=from.y+(to.y-from.y)*e;draw();
    if(k<1)viewAnim=requestAnimationFrame(step);};
  viewAnim=requestAnimationFrame(step);}
function fitView(){const b=viewBox(),p=28,bw=b.r-b.l,bh=b.b-b.t,s=Math.min((bw-p*2)/img.width,(bh-p*2)/img.height);
  return {s,x:b.l+(bw-img.width*s)/2,y:b.t+(bh-img.height*s)/2};}
function fit(){if(!img)return;cancelAnimationFrame(viewAnim);Object.assign(view,fitView());draw();}
function zoomAt(sx,sy,f){cancelAnimationFrame(viewAnim);const ix=(sx-view.x)/view.s,iy=(sy-view.y)/view.s;view.s*=f;view.x=sx-ix*view.s;view.y=sy-iy*view.s;draw();}
function zoomCenter(f){if(!img)return;const b=viewBox(),sx=(b.l+b.r)/2,sy=(b.t+b.b)/2,ix=(sx-view.x)/view.s,iy=(sy-view.y)/view.s,s=view.s*f;
  animateView({s,x:sx-ix*s,y:sy-iy*s});}
zin.onclick=()=>zoomCenter(1.25);
zout.onclick=()=>zoomCenter(.8);
zfit.onclick=()=>{if(img)animateView(fitView());};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.1:.9);},{passive:false});
const toImg=(x,y)=>({x:(x-view.x)/view.s,y:(y-view.y)/view.s});
const toScr=p=>({x:p.x*view.s+view.x,y:p.y*view.s+view.y});

/* ---------- pan ---------- */
let pan=false,panOff=null;
cv.addEventListener('pointerdown',e=>{if(e.button===1||e.shiftKey){cancelAnimationFrame(viewAnim);pan=true;panOff={x:e.offsetX-view.x,y:e.offsetY-view.y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';e.preventDefault();}});
cv.addEventListener('pointermove',e=>{mouse={x:e.offsetX,y:e.offsetY};
  if(pan){view.x=e.offsetX-panOff.x;view.y=e.offsetY-panOff.y;}
  else snap=(img&&(mode==='distance'||mode==='area'))?findSnap(e.offsetX,e.offsetY):null;
  draw();});
cv.addEventListener('pointerup',()=>{if(pan){pan=false;cv.style.cursor='crosshair';}});

/* ---------- placing ---------- */
function pointAt(x,y){const sp=findSnap(x,y);return sp?{x:sp.x,y:sp.y}:toImg(x,y);}
cv.addEventListener('click',e=>{if(!img||pan)return;
  if(mode==='calibrate'){const p=toImg(e.offsetX,e.offsetY);
    if(!calPending)calPending=[p];
    else if(calPending.length<2){calPending.push(p); setCalRow(true); calLen.focus(); calLen.select(); document.getElementById('calHint').textContent=T().calEnter;}
    draw();return;}
  pending.push(pointAt(e.offsetX,e.offsetY)); draw();});
cv.addEventListener('dblclick',()=>{finishPending();});
cv.addEventListener('contextmenu',e=>{e.preventDefault();
  if(pending.length)finishPending();
  else if(calPending){calPending=null;setCalRow(false);document.getElementById('calHint').textContent=T().calStart;draw();}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!dlg.open)cancelAll();});
function dedupe(){for(let i=pending.length-1;i>0;i--){const a=toScr(pending[i]),b=toScr(pending[i-1]);if(Math.hypot(a.x-b.x,a.y-b.y)<4)pending.splice(i,1);}}
function finishPending(){if(!pending.length)return;dedupe();
  if(mode==='distance'&&pending.length>=2)addItem('distance',[...pending]);
  else if(mode==='area'&&pending.length>=3)addItem('area',[...pending]);
  pending=[];snap=null;draw();}
function cancelAll(){
  if(pending.length)pending=[];
  else if(calPending){calPending=null;setCalRow(false);document.getElementById('calHint').textContent=T().calStart;}
  snap=null;draw();}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function addItem(type,pts){const g=ensureActiveGroup();
  const n=g.items.filter(i=>i.type===type).length+1;
  const base=type==='area'?T().area:T().distance;
  g.items.push({id:uid(),type,points:pts,value:computeValue(type,pts),name:base+' '+n});after();}
function after(){renderList();draw();save();}

/* ---------- calibrate ---------- */
function setCalRow(on){document.getElementById('calRow').classList.toggle('calrow-off',!on);}
calBtn.addEventListener('click',()=>{mode='calibrate';calPending=null;pending=[];syncTabs();
  setCalRow(false);calLen.value='1';document.getElementById('calHint').textContent=T().calStart;calBtn.classList.add('on');draw();});
calGo.addEventListener('click',applyCal);
calLen.addEventListener('keydown',e=>{if(e.key==='Enter')applyCal();});
function applyCal(){const L=parseFloat(calLen.value);
  if(!calPending||calPending.length<2){notify(T().alNeed2);return;}
  if(!(L>0)){notify(T().alLen);return;}
  const Lm = unit==='ft' ? L*FT2M : L;
  pxPerM=dist(calPending[0],calPending[1])/Lm;
  allItems().forEach(m=>m.value=computeValue(m.type,m.points));
  calPending=null;calBtn.classList.remove('on');setCalRow(false);calLen.blur();mode='distance';syncTabs();
  document.getElementById('calHint').textContent=T().calHint;
  document.getElementById('modeHint').textContent=T().distHint;updateScalePill();renderList();draw();save();}
function updateScalePill(){const p=document.getElementById('scalePill');
  if(pxPerM){const v = unit==='ft' ? pxPerM*FT2M : pxPerM; p.textContent=v.toFixed(1)+' px/'+unit;p.classList.add('on');}else{p.textContent=T().scaleNone;p.classList.remove('on');}}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;pending=[];calPending=null;calBtn.classList.remove('on');setCalRow(false);
  document.getElementById('calHint').textContent=T().calHint;syncTabs();
  document.getElementById('modeHint').textContent=mode==='area'?T().areaHint:T().distHint;draw();}));
function syncTabs(){document.querySelectorAll('.tabs button[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode&&mode!=='calibrate'));syncSegs();}

/* ---------- list/export/reset ---------- */
function fmt(v,t){if(v===null)return T().scaleMissing;
  if(unit==='ft'){ if(t==='area')return (v*M2FT2).toFixed(2)+' ft²'; const ft=v*M2FT; return ft<1?(v*M2IN).toFixed(1)+' in':ft.toFixed(2)+' ft'; }
  if(t==='area')return v.toFixed(2)+' m²'; return v<1?(v*100).toFixed(1)+' cm':v.toFixed(2)+' m';}
function fmtArea(s){return unit==='ft'?(s*M2FT2).toFixed(2)+' ft²':s.toFixed(2)+' m²';}
function delBtn(onclick){const b=document.createElement('button');b.className='icon-btn';b.innerHTML=ICON('x');b.setAttribute('aria-label',T().del);b.onclick=onclick;return b;}
// ids already on screen, so only newly added rows play the enter animation
let shown=null;
function renderList(){const wrap=document.getElementById('groups');wrap.innerHTML='';
  const prev=shown;shown=new Set();const fresh=id=>{shown.add(id);return prev&&!prev.has(id)?' enter':'';};
  if(!groups.length){wrap.innerHTML=`<div class="empty">${T().none}</div>`;}
  groups.forEach(g=>{
    const gd=document.createElement('div');gd.className='group'+(g.id===activeGroupId?' active':'')+fresh(g.id);
    gd.style.setProperty('--gc',g.color);
    const hd=document.createElement('div');hd.className='ghead';
    const dot=document.createElement('button');dot.className='gdot';dot.title=T().setActive;dot.setAttribute('aria-label',T().setActive);
    dot.onclick=()=>{activeGroupId=g.id;renderList();save();};
    const gname=document.createElement('input');gname.className='gname';gname.value=g.name;
    gname.onfocus=()=>{if(activeGroupId!==g.id){activeGroupId=g.id;wrap.querySelectorAll('.group').forEach(x=>x.classList.toggle('active',x===gd));save();}};
    gname.oninput=()=>{g.name=gname.value;save();};
    const gsum=document.createElement('span');gsum.className='gsum';
    const ar=g.items.filter(i=>i.type==='area'&&i.value!==null);
    if(ar.length)gsum.textContent=fmtArea(ar.reduce((a,i)=>a+i.value,0));
    const gdel=delBtn(async()=>{if(!await ask(T().cfGroup,T().del))return;groups=groups.filter(x=>x.id!==g.id);if(activeGroupId===g.id)activeGroupId=(groups[0]&&groups[0].id)||null;after();});
    hd.append(dot,gname,gsum,gdel);gd.append(hd);
    g.items.forEach(it=>{
      const row=document.createElement('div');row.className='item'+fresh(it.id);
      const iname=document.createElement('input');iname.className='iname';iname.value=it.name;
      iname.oninput=()=>{it.name=iname.value;save();};
      const v=document.createElement('span');v.className='v';v.textContent=fmt(it.value,it.type);
      const del=delBtn(()=>{g.items=g.items.filter(x=>x.id!==it.id);after();});
      row.append(iname,v,del);gd.append(row);
    });
    wrap.append(gd);
  });
  const allAr=allItems().filter(i=>i.type==='area'&&i.value!==null);
  const total=document.getElementById('total');
  if(allAr.length){total.style.display='flex';total.innerHTML=`<span>${T().sumAreas}</span><b>${fmtArea(allAr.reduce((a,i)=>a+i.value,0))}</b>`;}
  else total.style.display='none';}
/* ---------- PDF export (no external library) ---------- */
const measCtx=document.createElement('canvas').getContext('2d');
function hexN(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}
function pesc(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function lat1(s){let o='';for(const ch of s){const c=ch.codePointAt(0);o+=c<256?String.fromCharCode(c):'?';}return o;}
function renderAnnotated(){
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');
  x.drawImage(img,0,0);
  const lw=Math.max(2,img.width/650),dr=Math.max(3,img.width/320),fs=Math.max(13,Math.round(img.width/75));
  groups.forEach(g=>g.items.forEach(m=>{const p=m.points;
    x.lineWidth=lw;x.strokeStyle=g.color;x.fillStyle=g.color+'22';
    x.beginPath();p.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));
    if(m.type==='area'){x.closePath();x.fill();}x.stroke();
    x.fillStyle=g.color;p.forEach(q=>{x.beginPath();x.arc(q.x,q.y,dr,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=Math.max(1,lw*0.6);x.stroke();x.lineWidth=lw;});
    let cx=0,cy=0;p.forEach(q=>{cx+=q.x;cy+=q.y;});cx/=p.length;cy/=p.length;
    const t=fmt(m.value,m.type);x.font='bold '+fs+'px Helvetica,Arial,sans-serif';
    const tw2=x.measureText(t).width,th=fs*1.3;
    x.fillStyle='rgba(13,17,23,.82)';x.fillRect(cx-tw2/2-4,cy-th,tw2+8,th);
    x.fillStyle=g.color;x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx,cy-th/2);
  }));
  return c.toDataURL('image/jpeg',0.9);
}
function buildPDF(jpeg,iw,ih,content){
  const o=[];
  o[1]='<< /Type /Catalog /Pages 2 0 R >>';
  o[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  o[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 5 0 R >> /Font << /F1 6 0 R /F2 7 0 R >> >> /Contents 4 0 R >>';
  o[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  o[5]='<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n'+jpeg+'\nendstream';
  o[6]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  o[7]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  let pdf='%PDF-1.4\n';const off=[];
  for(let i=1;i<=7;i++){off[i]=pdf.length;pdf+=i+' 0 obj\n'+o[i]+'\nendobj\n';}
  const xref=pdf.length;pdf+='xref\n0 8\n0000000000 65535 f \n';
  for(let i=1;i<=7;i++)pdf+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const b=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)b[i]=pdf.charCodeAt(i)&0xff;return b;
}
function exportPDF(){
  if(!allItems().length||!img){notify(T().alNoMeas);return;}
  const dataUrl=renderAnnotated();const jpeg=atob(dataUrl.split(',')[1]);
  const DARK='0.14 0.16 0.18 rg ',GRAY='0.34 0.38 0.42 rg ';
  function txt(x,y,f,sz,colOp,str){return colOp+'BT /'+f+' '+sz+' Tf 1 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+' Tm ('+lat1(pesc(str))+') Tj ET\n';}
  function tw(str,sz){measCtx.font=sz+'px Helvetica,Arial,sans-serif';return measCtx.measureText(str).width;}
  const m=28,colX=560,rightEdge=820,boxW=colX-16-m,boxH=595-2*m;
  const sc=Math.min(boxW/img.width,boxH/img.height),dw=img.width*sc,dh=img.height*sc,ix=m,iy=595-m-dh;
  let cs='q '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+ix.toFixed(2)+' '+iy.toFixed(2)+' cm /Im0 Do Q\n';
  let y=595-m-6;
  cs+=txt(colX,y,'F2',15,DARK,T().meas);y-=20;
  const scaleStr=pxPerM?(unit==='ft'?(pxPerM*FT2M).toFixed(1)+' px/ft':pxPerM.toFixed(1)+' px/m'):'—';
  cs+=txt(colX,y,'F1',8.5,GRAY,T().scaleLbl+': '+scaleStr+'  ·  '+new Date().toLocaleDateString());y-=18;
  const truncate=(s,sz,maxW)=>{if(tw(s,sz)<=maxW)return s;let r=s;while(r.length>1&&tw(r+'..',sz)>maxW)r=r.slice(0,-1);return r+'..';};
  groups.forEach(g=>{
    if(y<m+24)return;
    const rgb=hexN(g.color);
    cs+=rgb[0].toFixed(3)+' '+rgb[1].toFixed(3)+' '+rgb[2].toFixed(3)+' rg '+colX+' '+(y-8).toFixed(1)+' 9 9 re f\n';
    cs+=txt(colX+15,y,'F2',11,DARK,truncate(g.name,11,rightEdge-colX-15-70));
    const ar=g.items.filter(i=>i.type==='area'&&i.value!==null);
    if(ar.length){const sum=fmtArea(ar.reduce((a,i)=>a+i.value,0));cs+=txt(rightEdge-tw(sum,9),y,'F1',9,GRAY,sum);}
    y-=16;
    g.items.forEach(it=>{
      if(y<m+12)return;
      const v=fmt(it.value,it.type),vw=tw(v,9.5);
      cs+=txt(colX+15,y,'F1',9.5,DARK,truncate(it.name,9.5,rightEdge-colX-15-vw-10));
      cs+=txt(rightEdge-vw,y,'F1',9.5,GRAY,v);y-=13;
    });
    y-=6;
  });
  const allAr=allItems().filter(i=>i.type==='area'&&i.value!==null);
  if(allAr.length&&y>m+14){const s=fmtArea(allAr.reduce((a,i)=>a+i.value,0));
    cs+='0.5 0.5 0.5 RG 0.5 w '+colX+' '+(y+2).toFixed(1)+' m '+rightEdge+' '+(y+2).toFixed(1)+' l S\n';y-=14;
    cs+=txt(colX,y,'F2',10,DARK,T().sumAreas+': '+s);}
  const bytes=buildPDF(jpeg,img.width,img.height,cs);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='floorplan-measurements.pdf';a.click();
}
document.getElementById('addGroup').onclick=()=>{const g={id:uid(),name:groupDefaultName(),color:pickColor(),items:[]};groups.push(g);activeGroupId=g.id;after();};
document.getElementById('export').onclick=exportPDF;
reset.onclick=async()=>{if(!await ask(T().cfReset,T().resetConfirm))return;img=null;imgSrc=null;pxPerM=null;groups=[];activeGroupId=null;pending=[];calPending=null;pdfDoc=null;syncPager();
  localStorage.removeItem(KEY);drop.classList.remove('hide');setCalRow(false);updateScalePill();renderList();draw();};

/* ---------- draw ---------- */
function draw(){ctx.clearRect(0,0,W,H);if(!img)return;
  ctx.imageSmoothingEnabled=view.s<2;ctx.drawImage(img,view.x,view.y,img.width*view.s,img.height*view.s);
  groups.forEach(g=>g.items.forEach(m=>poly(m.points,g.color,fmt(m.value,m.type),m.type==='area')));
  if(calPending){const lv=(calPending.length===1&&mouse)?[calPending[0],toImg(mouse.x,mouse.y)]:calPending;line(lv,TH.accent,T().calibration);}
  if(pending.length){const cur=snap?snap:(mouse?toImg(mouse.x,mouse.y):null);const lv=cur?[...pending,cur]:[...pending];
    const ag=groups.find(g=>g.id===activeGroupId);const pc=ag?ag.color:pickColor();
    poly(lv,pc,'',false);}
  if(snap){const s=toScr(snap);ctx.beginPath();ctx.arc(s.x,s.y,8,0,7);ctx.strokeStyle=TH.accent;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=TH.accent+'33';ctx.fill();}}
function line(p,c,lab){if(!p.length)return;const a=toScr(p[0]);ctx.lineWidth=2;ctx.strokeStyle=c;ctx.fillStyle=c;dot(a);
  if(p.length>1){const b=toScr(p[1]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=c;dot(b);if(lab)tag((a.x+b.x)/2,(a.y+b.y)/2,lab,c);}}
function poly(p,c,lab,closed){if(!p.length)return;ctx.lineWidth=2;ctx.strokeStyle=c;ctx.fillStyle=c+'22';ctx.lineJoin='round';
  ctx.beginPath();p.forEach((q,i)=>{const s=toScr(q);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);});
  if(closed)ctx.closePath();if(closed&&p.length>=3)ctx.fill();ctx.stroke();p.forEach(q=>{ctx.fillStyle=c;dot(toScr(q));});
  if(lab){let cx=0,cy=0;p.forEach(q=>{const s=toScr(q);cx+=s.x;cy+=s.y;});tag(cx/p.length,cy/p.length,lab,c);}}
function dot(s){ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.lineWidth=2;}
function pill(x,y,w,h){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,h/2);else ctx.rect(x,y,w,h);}
function tag(x,y,t,c){ctx.font='600 12px '+TH.font;const w=ctx.measureText(t).width,h=22,pw=w+30,bx=x-pw/2,by=y-h-6;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=10;ctx.shadowOffsetY=2;
  ctx.fillStyle=TH.tagBg;pill(bx,by,pw,h);ctx.fill();ctx.restore();
  ctx.strokeStyle=TH.tagLine;ctx.lineWidth=1;pill(bx+.5,by+.5,pw-1,h-1);ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(bx+12,by+h/2,3.5,0,7);ctx.fill();
  ctx.fillStyle=TH.tagFg;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t,bx+21,by+h/2+.5);ctx.lineWidth=2;}

readTheme(); resize(); restore(); applyLang();
</script>
